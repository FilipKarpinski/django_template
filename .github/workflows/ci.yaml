name: "CI"

on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - "main"
      - "release"

concurrency:
  group:
    ${{ github.workflow }}-${{ github.ref_name }}-${{
    github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: "ubuntu-latest"

    steps:
      - uses: "actions/checkout@v4"

      - uses: astral-sh/setup-uv@v5

      - run: uv run ruff check
      - run: uv run ruff format --check

      - run: uv run ty check

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check vendored Tailwind CSS is up to date
        run: |
          npx --yes tailwindcss@3.4.17 -c tailwind.config.js \
            -i assets/tailwind.css -o src/static/vendor/tailwind.css --minify
          git diff --exit-code -- src/static/vendor/tailwind.css

  test:
    needs: [lint]
    if: github.event_name == 'pull_request'
    runs-on: "ubuntu-latest"

    steps:
      - uses: "actions/checkout@v4"

      - name: Prepare environment
        run: cp --no-clobber .env.example .env

      - name: Build Docker containers
        run: docker compose build

      - name: Start Docker containers
        run: docker compose up -d app

      - name: Run tests
        run: docker compose exec app pytest --ds=config.settings.test

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Clean up
        if: always()
        run: docker compose down -v

  build:
    needs: [lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
      packages: write

    steps:
      - uses: "actions/checkout@v4"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: "ubuntu-latest"

    steps:
      - uses: "actions/checkout@v4"

      - name: Copy deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          target: ${{ secrets.DEPLOY_PATH }}
          source: "compose.prod.yml,nginx/"

      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose -f compose.prod.yml pull app
            docker compose -f compose.prod.yml up -d
            docker compose -f compose.prod.yml exec app python manage.py migrate --noinput
            docker image prune -f
